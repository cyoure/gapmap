services:
  ollama:
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # 받은 모델(수 GB)을 컨테이너 재생성 후에도 유지
    restart: unless-stopped
    # GPU 없음(AMD 내장 그래픽) → CPU 추론. NVIDIA GPU가 생기면 deploy.resources 추가

  chroma:
    image: chromadb/chroma:1.0.0
    ports:
      - "8001:8000"                 # 호스트 8000은 api가 쓰므로 8001로 노출
    volumes:
      - chroma_data:/data           # 벡터 데이터 영속화
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:                    # 값은 .env에서 (compose가 ${...}를 자동으로 채움)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data   # 공고·분석 결과 영속화
    # 포트는 호스트에 열지 않음 — api만 compose 네트워크 안에서 접근 (확인은 docker compose exec)
    healthcheck:                    # "컨테이너 시작"이 아니라 "DB 접속 가능"을 확인
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./api/app:/app/app          # 개발용: 코드 수정 시 --reload로 즉시 반영
      - ./data:/data:ro             # 이력서 — 이미지에 굽지 않고 읽기 전용으로만 연결
    depends_on:
      ollama:
        condition: service_started
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy  # DB가 접속 가능해진 뒤에 api 시작 (시작 시 테이블 생성)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ollama_data:
  chroma_data:
  pg_data:
