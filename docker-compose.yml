services:
  ollama:
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # 받은 모델(수 GB)을 컨테이너 재생성 후에도 유지
    restart: unless-stopped
    # GPU 없음(AMD 내장 그래픽) → CPU 추론. NVIDIA GPU가 생기면 deploy.resources 추가

  chroma:
    image: chromadb/chroma:1.0.0
    ports:
      - "8001:8000"                 # 호스트 8000은 api가 쓰므로 8001로 노출
    volumes:
      - chroma_data:/data           # 벡터 데이터 영속화
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./api/app:/app/app          # 개발용: 코드 수정 시 --reload로 즉시 반영
      - ./data:/data:ro             # 이력서 — 이미지에 굽지 않고 읽기 전용으로만 연결
    depends_on:
      - ollama
      - chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ollama_data:
  chroma_data:
